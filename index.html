<head>

<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--txt:#1c1f23;--dim:#6b7280;--blue:#2563eb;--green:#15803d;--red:#dc2626;--amber:#b45309}
  @media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1c1f24;--line:#2c3138;--txt:#e8eaed;--dim:#9aa3ad;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--amber:#fbbf24}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:860px;margin:0 auto;padding:16px 14px 80px}
  h1{font-size:20px;margin:8px 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .sticky{position:sticky;top:0;z-index:9;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{flex:1 1 auto;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;font-size:14px;cursor:pointer}
  .tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--dim)}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;color:var(--txt)}
  .timer.warn{color:var(--red)}
  .grow{flex:1}
  .btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px;cursor:pointer;font-weight:600}
  .btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;content-visibility:auto;contain-intrinsic-size:260px}
  .q.ok{border-color:var(--green)}
  .q.no{border-color:var(--red)}
  .qh{display:flex;gap:8px;align-items:baseline;margin-bottom:8px;font-size:13px;color:var(--dim)}
  .no1{font-weight:700;color:var(--txt);font-size:15px}
  .stem{margin:0 0 10px;white-space:pre-wrap}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer}
  .opt:hover{border-color:var(--blue)}
  .opt.sel{border-color:var(--blue);background:rgba(37,99,235,.08)}
  .opt.right{border-color:var(--green);background:rgba(21,128,61,.10)}
  .opt.wrong{border-color:var(--red);background:rgba(220,38,38,.10)}
  .opt input{margin-top:5px}
  .lt{font-weight:700;min-width:16px}
  .tf{display:flex;gap:10px}
  .tf .opt{flex:1;justify-content:center}
  .blank{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font-size:16px}
  textarea{width:100%;min-height:110px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font-size:15px;font-family:inherit;line-height:1.7}
  .exp{margin-top:10px;padding:10px 12px;border-left:3px solid var(--blue);background:rgba(37,99,235,.07);border-radius:0 8px 8px 0;font-size:14px;line-height:1.75}
  .exp b{color:var(--txt)}
  .tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}
  .tag.g{color:var(--green);border-color:var(--green)}
  .tag.r{color:var(--red);border-color:var(--red)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .self{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim)}
  .self button{padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt);cursor:pointer;font-size:13px}
  .self button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .mods{font-size:14px}
  .mods div{padding:6px 0;border-bottom:1px dashed var(--line)}
  .mods div:last-child{border:0}
  .mods b{color:var(--red)}
  .ask{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:none;align-items:center;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .ask.on{display:flex}
  .ask span{flex:1;font-size:14px}
  .foot{color:var(--dim);font-size:13px;margin-top:22px;line-height:1.8}
  @media print{.sticky,.tabs,.btn{display:none!important}.q{break-inside:avoid}}
</style>
</head>

</div>

<script>
var LETTERS=['A','B','C','D','E','F'];

var PAPERS={
selftest:{name:'自测题 30 道',limit:0,total:51,mods:null,questions:[
{t:'single',s:1,q:'系统科学中“系统的三要素”是指：',o:['输入、输出、反馈','元素、结构、环境','物质、能量、信息','个体、规则、涌现'],a:'B',e:'元素、结构、环境。输入/输出/反馈是控制论的描述方式，容易混淆。'},
{t:'single',s:1,q:'下列关于“涌现”的说法，正确的是：',o:['涌现就是随机性','涌现指整体出现了部分所不具有的性质或功能','涌现只能发生在生物系统中','涌现意味着部分的行为可以忽略'],a:'B',e:'涌现＝宏观层面出现部分所不具有的性质；它与随机性无关，也不限于生物系统。'},
{t:'single',s:1,q:'空调把室温维持在设定值附近，这一过程属于：',o:['正反馈','负反馈','前馈','无反馈'],a:'B',e:'把室温“维持在设定值附近”是目标追寻，属负反馈。正反馈会放大偏差（越来越热或越来越冷）。'},
{t:'single',s:1,q:'提出“一般系统论”的是：',o:['维纳','香农','贝塔朗菲','普利高津'],a:'C',e:'贝塔朗菲《一般系统论》；维纳＝控制论，香农＝信息论，普利高津＝耗散结构。'},
{t:'single',s:1,q:'信息熵 H = −Σ p(i)·log p(i) 刻画的是：',o:['信道的最大传输速率','事件的自信息之和','平均自信息（不确定性的平均度量）','两个随机变量的相互依赖程度'],a:'C',e:'信息熵是“平均自信息”，度量不确定性；信道容量是最大传输速率，互信息度量相互依赖程度。'},
{t:'single',s:1,q:'耗散结构理论认为，系统形成有序结构需要满足的条件不包括：',o:['开放系统','远离平衡态','非线性相互作用','完全孤立于环境'],a:'D',e:'耗散结构恰恰要求系统开放；孤立系统只会熵增。四个条件是：开放、远离平衡态、非线性相互作用、涨落触发。'},
{t:'single',s:1,q:'协同学中的“役使原理”指的是：',o:['整体支配部分','慢变量支配快变量','外部指令支配内部运动','随机涨落支配系统演化'],a:'B',e:'役使原理＝慢变量支配快变量（序参量支配子系统）。'},
{t:'single',s:1,q:'“君子慎始，差若毫厘，谬以千里”最直接对应：',o:['突变论','蝴蝶效应（对初始条件的敏感依赖）','耗散结构','公地悲剧'],a:'B',e:'强调的是初始微小差异导致结果巨大差异。'},
{t:'single',s:1,q:'关于“混沌”，下列说法正确的是：',o:['混沌就是随机过程','混沌系统完全不可预测，连短期也不可预测','混沌由确定的规则产生，但长期行为不可预测','混沌只出现在数学模型里，现实中不存在'],a:'C',e:'混沌是确定性系统产生的非周期、类随机行为；短期可预测（如短期天气预报），长期不可预测；现实中广泛存在。'},
{t:'single',s:1,q:'在系统动力学中，“存量”与“流量”的关系是：',o:['存量是流量的导数','存量对时间的导数等于流量','两者无关','流量是存量的平方'],a:'B',e:'存量对时间的导数＝流量（也可记成“存量是流量的积分”）。'},
{t:'single',s:1,q:'供应链中的“牛鞭效应”（啤酒游戏）说明：',o:['局部理性决策叠加后可能导致系统动荡','信息越少系统越稳定','延迟有利于稳定','库存越多越好'],a:'A',e:'需求微小波动沿供应链逐级放大，局部理性叠加成系统动荡。'},
{t:'single',s:1,q:'一个网络的度分布服从幂律、少数节点拥有大量连接，这种网络是：',o:['规则网络','随机网络','小世界网络','无标度网络'],a:'D',e:'幂律度分布＋枢纽节点＝无标度网络。'},
{t:'single',s:1,q:'判断“某个同学在不同班级之间传递信息最关键”，最适合用：',o:['度中心性','介数中心性','接近中心性','聚类系数'],a:'B',e:'跨圈子传递信息靠“桥梁”，用介数中心性；度中心性适合找“通知谁最快扩散”，接近中心性适合“谁到所有人平均距离最近”。'},
{t:'single',s:1,q:'霍尔三维结构的三个维度是：',o:['时间维、逻辑维、知识维','输入维、过程维、输出维','要素维、结构维、环境维','正反馈维、负反馈维、延迟维'],a:'A',e:'时间维、逻辑维、知识维。'},
{t:'single',s:1,q:'“公地悲剧”最核心的机制是：',o:['个体理性导致集体非理性','信息传递延迟','系统的层次性','网络的无标度性'],a:'A',e:'每个个体都想多放牧（个体理性），草地被耗尽（集体非理性）。'},
{t:'tf',s:1,q:'孤立系统的熵永远不会减少。',a:true,e:'热力学第二定律。'},
{t:'tf',s:1,q:'自组织系统需要外部指令才能产生有序结构。',a:false,e:'自组织不需要外部指令；需要外部指令的是他组织。'},
{t:'tf',s:1,q:'系统的边界是客观固定的，与研究者提出的问题无关。',a:false,e:'边界可以按不同问题划分，划分方式不同，研究对象也不同。'},
{t:'tf',s:1,q:'负反馈的作用是放大偏差、加速系统变化。',a:false,e:'放大偏差的是正反馈；负反馈是维持稳定。'},
{t:'tf',s:1,q:'无标度网络对随机失效比较鲁棒，但对针对枢纽节点的蓄意攻击非常脆弱。',a:true,e:'这是无标度网络的典型“鲁棒又脆弱”特性。'},
{t:'tf',s:1,q:'系统中的“延迟”往往会引发振荡甚至失控。',a:true,e:'延迟是振荡与失控的常见原因（如库存管理、政策滞后）。'},
{t:'tf',s:1,q:'规则网络的特点是聚类系数高、平均路径长。',a:true,e:'规则网络聚类系数高、平均路径长；随机网络相反。'},
{t:'tf',s:1,q:'整体论与系统论是一回事，都是只强调整体、不考虑部分。',a:false,e:'整体论只看整体；系统论兼顾整体与部分，并研究各层次之间的关联互动。'},
{t:'essay',s:4,q:'请说明“开放系统”与“孤立系统”的区别，并各举一例。',e:'开放系统与环境交换物质、能量、信息（如生物体、城市）；孤立系统与环境不发生任何交换（如整个宇宙）。<br>要点：<b>是否与环境交换</b>。'},
{t:'essay',s:4,q:'用“元素—结构—环境”三要素，分析“一个班级的学习氛围”这个系统。',e:'要素：每位同学、老师、学习资料；<br>结构：座位关系、小组划分、同伴影响、班规与评价方式；<br>环境：学校要求、家庭支持、考试压力。<br>要点：<b>结构影响功能</b>——同样的要素按不同结构组织，会形成完全不同的学习氛围。'},
{t:'essay',s:4,q:'请写出信息熵的公式，并说明：当事件只有两种结果、概率各为 0.5 时，信息熵是多少？（log₂0.5 = −1）',e:'H = −Σ p·log₂p；<br>两个结果各 0.5 时 H = −(0.5×(−1) + 0.5×(−1)) = <b>1 比特</b>。<br>含义：一次结果恰好提供 1 比特信息。'},
{t:'essay',s:4,q:'某班同学发现：老师批评一次 → 学生沮丧 → 成绩下降 → 老师更频繁批评。请指出这条链条属于什么反馈，并说明它会带来什么后果。',e:'属于<b>正反馈</b>（偏差被放大）。<br>后果：师生关系恶化、成绩持续下滑，形成“滚雪球”式的恶性循环。<br>调控思路：打断回路（例如把反馈从“批评”改为“具体改进建议”），或加入负反馈（设定阶段性小目标并及时肯定）。'},
{t:'essay',s:4,q:'在一个 40 人的班级关系网络中，同学甲的好友不多（度中心性低），但他是“两个小圈子之间唯一认识的人”。请说明甲在哪些任务中比“好友最多的同学”更重要，为什么。',e:'甲在“<b>跨群体协调／信息在圈子之间传递</b>”这类任务中更重要：他占据<b>结构洞</b>位置，<b>介数中心性高</b>，是信息跨越小圈子的必经桥梁。<br>而“好友最多”的同学度中心性高，更适合“尽快让信息在圈内扩散”。<br>结论：<b>重要性取决于任务目标，指标必须与任务匹配</b>。'},
{t:'essay',s:4,q:'一个水池有进水口和出水口，水位由两者之差决定，但水位传感器有 10 分钟延迟。请预测：如果控制系统加大调节力度，水池水位会出现什么现象？说明理由。',e:'会出现<b>振荡</b>甚至发散：传感器延迟使控制器“依据过期信息”调节，纠正总是滞后，导致<b>过冲—反向过冲</b>反复。<br>减轻办法：降低调节增益、缩短采样延迟、引入预测（前馈）。<br>要点：<b>延迟＋强反馈 → 振荡</b>。'},
{t:'essay',s:4,q:'请从“局部规则 → 全局涌现”的角度，解释为什么鸟群不需要指挥者也能整体转向；并举出一个生活中类似的例子。',e:'每只鸟只根据邻近同伴的方向调整自己的方向（局部规则），这种局部调整在大量个体上反复叠加，就在群体层面产生了整体转向（全局涌现）。没有中心指挥，靠的是个体间的相互作用。<br>类似例子：鱼群骤然一致转向、球迷“人浪”、课间操人流在某处自动分流、蚁群通过信息素形成稳定路径。'}
]},

mockA:{name:'模拟卷 A',limit:3000,total:100,mods:[
 ['系统科学基础概念',[1,2,3,4,5,18,26,34,36]],
 ['老三论（系统论／控制论／信息论）',[6,7,10,11,12,27,29,37,38]],
 ['新三论与自组织',[8,9,13,14,15,16,17,19,20,21,22,28,30,31]],
 ['系统动力学',[25,32,40,44]],
 ['复杂网络',[23,24,33,43]],

],questions:[
{t:'single',s:2,q:'系统科学中“系统”的定义是：',o:['由若干相同部分简单相加而成的集合','由相互作用、相互依赖的若干部分结合而成的、具有特定功能的有机整体','与环境不发生任何交换的封闭整体','由人设计并控制的机器装置'],a:'B',e:'抓住两个关键词：<b>相互作用／相互依赖</b>（不是简单相加）、<b>具有特定功能的有机整体</b>。A 错在“简单相加”，C 是孤立系统的特征，D 把系统窄化为人工装置。'},
{t:'single',s:2,q:'系统的三要素是：',o:['输入、输出、反馈','元素、结构、环境','物质、能量、信息','个体、规则、涌现'],a:'B',e:'元素、结构、环境。A 的“输入—输出—反馈”是控制论的描述方式，最容易混。'},
{t:'single',s:2,q:'下列关于“系统论”的说法，正确的是：',o:['系统论就是还原论，主张把整体拆成部分研究','系统论就是整体论，只看整体不看部分','系统论兼顾整体与部分，研究各层次之间的关联与互动','系统论只研究人工系统，不研究自然系统'],a:'C',e:'系统论兼顾整体与部分，研究各层次之间的关联与互动；还原论是拆开研究，整体论是只看整体。'},
{t:'single',s:2,q:'下列属于“开放系统”的是：',o:['整个宇宙','一个完全隔热的密闭容器','一棵正在生长的树','与外界完全隔绝的一潭死水'],a:'C',e:'生长的树与环境交换物质、能量、信息，是开放系统；宇宙是典型的孤立系统。'},
{t:'single',s:2,q:'关于“系统的边界”，下列说法正确的是：',o:['边界是客观固定的，任何研究都一样','边界可以按不同问题作不同划分，划分不同则研究对象也不同','边界一定是有形的物理界面','边界越宽越好，越宽越接近真实'],a:'B',e:'边界可以按不同问题划分，划分方式不同，研究对象也随之不同。'},
{t:'single',s:2,q:'提出“一般系统论”、主张“整体大于部分之和”的是：',o:['维纳','香农','贝塔朗菲','普利高津'],a:'C',e:'贝塔朗菲（《一般系统论》）。维纳＝控制论，香农＝信息论，普利高津＝耗散结构。'},
{t:'single',s:2,q:'控制论研究的两大主题是：',o:['熵与信息','反馈与通信','结构与功能','突变与分岔'],a:'B',e:'控制论研究反馈与通信。核心概念：正反馈（放大偏差）、负反馈（维持稳定）、前馈（预测校正）。'},
{t:'single',s:2,q:'下列属于正反馈的是：',o:['恒温器把室温稳定在设定值','人体通过出汗把体温降回正常','病毒传播中感染人数越多、传播越快','不倒翁被推倒后自动回到直立'],a:'C',e:'感染人数越多传播越快，是典型的偏差被放大＝正反馈；A、B、D 都是维持稳定或回归目标＝负反馈。'},
{t:'single',s:2,q:'下列属于负反馈的是：',o:['经济泡沫中价格上涨引发更多买入、价格再涨','血糖升高后胰岛素分泌增加使血糖回落','表扬带来自信、自信带来更努力、成绩更好','小误会不解释导致不满积累、矛盾升级'],a:'B',e:'血糖升高→胰岛素分泌→血糖回落，是目标追寻＝负反馈；A、C、D 都是滚雪球式放大＝正反馈。'},
{t:'single',s:2,q:'“前馈”在控制系统中的作用是：',o:['放大偏差','维持稳定','依据预测提前校正','消除系统中的延迟'],a:'C',e:'前馈＝依据预测提前校正，不等偏差出现就动作。'},
{t:'single',s:2,q:'信息论中，信息熵 H = −Σ p(i)·log p(i) 表示：',o:['信道在单位时间内能传送的最大信息量','平均自信息，即系统不确定性的平均度量','两个随机变量之间的相互依赖程度','事件发生概率的总和'],a:'B',e:'信息熵是“平均自信息”，度量不确定性；信道容量是单位时间最大信息量；互信息度量两个变量的相互依赖程度。'},
{t:'single',s:2,q:'在信息论中，一个事件发生的概率越小，则：',o:['它的自信息越小','它的自信息越大','与自信息无关','它的信息熵为零'],a:'B',e:'事件概率越小，自信息越大，发生时所减少的不确定性越多。'},
{t:'single',s:2,q:'耗散结构理论认为，系统形成有序结构需要满足的条件不包括：',o:['系统是开放的','系统远离平衡态','存在非线性相互作用','系统完全孤立、与外界无交换'],a:'D',e:'耗散结构恰恰要求系统开放；孤立系统只会熵增。四个条件是：开放、远离平衡态、非线性相互作用、涨落触发。'},
{t:'single',s:2,q:'协同学中的“役使原理”指的是：',o:['整体支配部分','慢变量支配快变量','外部指令支配内部运动','随机涨落支配系统演化'],a:'B',e:'役使原理＝慢变量支配快变量（序参量支配子系统）。'},
{t:'single',s:2,q:'突变论研究的是：',o:['参数连续变化时，系统状态在临界点发生突然跳跃（相变）','系统参数的缓慢漂移','系统要素数量的缓慢增加','系统边界的重新划分'],a:'A',e:'突变论：参数连续变化，状态在临界点突然跳跃，即相变；常见模式有折迭、尖点、燕尾。'},
{t:'single',s:2,q:'关于“熵”和“负熵”，下列说法正确的是：',o:['熵是有序程度的度量','孤立系统的熵永远不会减少','负熵只能由系统内部产生','熵增意味着系统更有序'],a:'B',e:'熵是无序程度的度量；孤立系统熵永不减少；负熵来自外界输入。'},
{t:'single',s:2,q:'蜂群不需要指挥者就能建造结构精巧的蜂巢，这属于：',o:['他组织','自组织','还原','突变'],a:'B',e:'无外部指令、自行产生有序＝自组织。'},
{t:'single',s:2,q:'“涌现”指的是：',o:['系统各部分性质的简单相加','系统中各部分通过相互作用，在宏观层面产生部分所不具有的特征或功能','系统状态的随机波动','系统与环境的物质交换'],a:'B',e:'涌现＝宏观层面出现部分所不具有的性质或功能。'},
{t:'single',s:2,q:'复杂适应系统（CAS）中“适应性主体”的特点是：',o:['行为固定不变','能根据环境调整自身规则、具有学习与演化能力','只能被动接受外部指令','与环境完全隔绝'],a:'B',e:'适应性主体能学习与演化、根据环境调整自身规则（霍兰德，CAS）。'},
{t:'single',s:2,q:'关于“混沌”，下列说法正确的是：',o:['混沌就是随机过程，与规则无关','混沌系统连短期也无法预测','混沌由确定的规则产生，但长期行为不可预测','混沌只存在于数学模型中，现实中不存在'],a:'C',e:'混沌由确定规则产生、非周期、类随机；短期可预测、长期不可预测；现实中广泛存在（洛伦兹、三体）。'},
{t:'multi',s:3,q:'下列属于系统科学“新三论”（自组织理论）的是：',o:['耗散结构理论','协同学','突变论','信息论','控制论'],a:'ABC',e:'“新三论”＝自组织理论三件套：耗散结构（普利高津）、协同学（哈肯）、突变论（托姆）。信息论、控制论属于“老三论”（与一般系统论并列）。'},
{t:'multi',s:3,q:'耗散结构理论认为，形成有序结构需要具备的条件包括：',o:['系统开放','远离平衡态','非线性相互作用','涨落触发','系统完全孤立'],a:'ABCD',e:'耗散结构四条件：开放系统、远离平衡态、非线性相互作用、涨落触发。E 与“开放”直接矛盾。'},
{t:'multi',s:3,q:'下列属于常见网络类型的有：',o:['规则网络','随机网络','小世界网络','无标度网络','孤立网络'],a:'ABCD',e:'规则网络、随机网络、小世界网络、无标度网络是四类基本模型；“孤立网络”不是网络类型（“孤立系统”是系统分类概念）。'},
{t:'multi',s:3,q:'关于“无标度网络”，下列说法正确的有：',o:['度分布服从幂律分布','少数枢纽节点拥有大量连接','对随机失效比较鲁棒','对针对大度节点的蓄意攻击非常脆弱','平均路径长度必然大于规则网络'],a:'ABCD',e:'无标度网络：幂律度分布、存在枢纽节点、对随机失效鲁棒、对蓄意攻击大度节点极其脆弱。E 错：无标度网络因存在远距离枢纽连接，平均路径通常<b>较短</b>，不是必然更长。'},
{t:'multi',s:3,q:'下列属于系统动力学常见“基模”的有：',o:['增长上限','转移负担','公地悲剧','中心极限定理','幂律分布'],a:'ABC',e:'常见基模：增长上限、转移负担、公地悲剧。中心极限定理是概率论定理，幂律分布是无标度网络／自组织临界里的分布特征，都不是系统动力学的基模。'},
{t:'tf',s:1,q:'“整体大于部分之和”是系统科学整体性原理的形象表述。',a:true,e:'整体性原理的标准表述。'},
{t:'tf',s:1,q:'孤立系统的熵永远不会减少。',a:true,e:'热力学第二定律。'},
{t:'tf',s:1,q:'自组织系统必须依靠外部指令才能产生有序结构。',a:false,e:'需要外部指令的是“他组织”；自组织不需要。'},
{t:'tf',s:1,q:'负反馈的作用是放大偏差、加速系统变化。',a:false,e:'放大偏差的是正反馈；负反馈维持稳定。'},
{t:'tf',s:1,q:'混沌是确定性系统产生的非周期、类随机行为。',a:true,e:'混沌是确定性系统产生的非周期、类随机行为，<b>不等于随机过程</b>。'},
{t:'tf',s:1,q:'系统中存在延迟时，反馈调节有可能引发振荡甚至失控。',a:true,e:'延迟是振荡与失控的常见原因（库存管理、政策滞后）。'},
{t:'tf',s:1,q:'系统动力学中，存量对时间的导数等于流量。',a:true,e:'存量对时间的导数＝流量（也可记成“存量是流量的积分”）。'},
{t:'tf',s:1,q:'规则网络的特点是聚类系数高、平均路径短。',a:false,e:'规则网络是<b>聚类系数高、平均路径长</b>；“聚类高＋路径短”是小世界网络。'},
{t:'tf',s:1,q:'“多构同功”指不同的结构可以实现相同的功能。',a:true,e:'多构同功＝不同结构实现相同功能（例：不同交通工具都能载人）。'},
{t:'tf',s:1,q:'“公地悲剧”的实质是个体理性导致集体非理性。',a:true,e:'每个个体只顾自己多放牧（个体理性），草地被耗尽（集体非理性）。'},
{t:'blank',s:2,q:'系统的三要素是元素、__________、环境。',need:['结构'],e:'元素、<b>结构</b>、环境。'},
{t:'blank',s:2,q:'信息熵的计算公式是 H = __________。',need:['log',['σ','∑','sum','sigma']],e:'H = −Σ p(i)·log p(i)（写成 −Σ p log₂p 同样给分）。'},
{t:'blank',s:2,q:'提出“一般系统论”的学者是__________。',need:[['贝塔朗菲','贝塔兰菲']],e:'贝塔朗菲。'},
{t:'blank',s:2,q:'霍尔三维结构包括时间维、逻辑维和__________。',need:['知识维'],e:'时间维、逻辑维、<b>知识维</b>。'},
{t:'blank',s:2,q:'系统动力学中，存量对时间的导数等于__________。',need:['流量'],e:'存量对时间的导数＝<b>流量</b>。'},
{t:'essay',s:5,q:'请用“观察—抽象—建模—验证—优化”这五个环节，简要说明一次完整的系统科学探究是如何展开的（每个环节一句话）。',e:'<b>观察</b>：从真实世界现象入手，记录看到的规律与疑问（如鸟群为什么能整体转向）。<br><b>抽象</b>：抓住关键要素，把现实对象简化为“个体＋状态＋相互作用规则”，明确暂不考虑什么。<br><b>建模</b>：把规则写成可计算、可执行的模型（方程或程序），并设定参数。<br><b>验证</b>：用实验或仿真结果与真实观测对照，检查模型能否重现现象；做退化检验、重复运行。<br><b>优化</b>：根据偏差修改假设或参数，必要时加入新机制，再回到验证环节迭代。<br><span class="tag">评分</span> 每写对 1 个环节给 1 分；只堆名词、没有体现“循环迭代”的扣 1 分。'},
{t:'essay',s:5,q:'某班出现这样的情况：上课说话的人多 → 老师批评 → 部分同学产生抵触 → 上课说话的人更多。<br>（1）这属于哪种反馈？说明判断依据。<br>（2）要让它回到稳定状态，请提出两种干预思路。',e:'<b>（1）属于正反馈</b>（2 分）。判断依据：偏差被不断放大——说话多导致批评，批评引发抵触，抵触又使说话更多，形成“滚雪球”，系统偏离稳定状态越来越远。<br><b>（2）干预思路</b>（每种 1.5 分，答出两种即可）：<br>· <b>打断回路</b>：把“批评”改为具体、可执行的改进建议，消除“抵触”这一环。<br>· <b>引入负反馈</b>：设立明确的小目标和正向激励（如小组自我管理、达成即肯定），让系统朝“说话减少”的稳定状态回归。<br>· 其他合理答案：改变班级规则与座位结构、增加课堂互动环节、由同学自主协商公约等。'},
{t:'essay',s:5,q:'在一个班级关系网络中，甲的好友数量并不多，但他是两个小圈子之间唯一互相认识的人。<br>（1）若用度中心性衡量，甲处于什么位置？<br>（2）若任务是“在两个小圈子之间传话、协调活动”，甲是否合适？为什么？<br>（3）这说明选择“重要性指标”时必须以什么为前提？',e:'<b>（1）</b>甲的<b>度中心性低</b>（好友数量少，处于中下游）。（1 分）<br><b>（2）合适</b>（1 分）。因为甲是连接两个小圈子的<b>唯一通道</b>，他的<b>介数中心性高</b>，是信息跨越小圈子时必经的“桥梁”；而“好友最多”的同学度中心性高，更适合在<b>圈内</b>快速扩散信息。（2 分）<br><b>（3）</b>必须以<b>任务目标</b>为前提：不同任务（快速扩散／跨群体协调／平均可达）对应的“重要”含义不同，指标必须与任务匹配，不能拿一把尺子量所有问题。（1 分）'},
{t:'essay',s:5,q:'某水池靠进水口和出水口调节水位，但水位传感器有 10 分钟延迟。管理人员为让水位更快达标，把调节幅度调得很大。<br>（1）预测水位会怎样变化？<br>（2）说明理由。<br>（3）提出两条缓解措施。',e:'<b>（1）</b>水位会<b>上下振荡</b>，甚至越调越厉害（1 分）。<br><b>（2）</b>传感器有 10 分钟延迟，控制器依据的是<b>过期的水位信息</b>；调节幅度又大，等到发现“调过头”时已经晚了，于是反向大幅调节，形成<b>过冲与反向过冲</b>的反复。（2 分）<br><b>（3）缓解措施</b>（每条 1 分，答出两条即可）：减小调节幅度（降低增益）；缩短采样延迟或提高采样频率；引入预测（前馈），按进水与出水速率提前动作；加大水池容积作缓冲，让系统对扰动不敏感。'},
{t:'essay',s:5,q:'请从“局部规则 → 全局涌现”的角度，说明为什么鸟群在没有任何指挥者的情况下也能整体转向。<br>要求：先写清局部规则是什么，再说明全局秩序如何产生，最后举一个生活中的类似例子。',e:'<b>（1）局部规则（2 分）</b>：每只鸟只感知邻近的少数同伴，并按三条规则调整自己——<b>分离</b>（避免与过近个体碰撞）、<b>对齐</b>（方向趋近邻居的平均方向）、<b>聚合</b>（向邻居所在区域靠拢）。没有任何一只鸟掌握全局信息。<br><b>（2）全局秩序如何产生（2 分）</b>：这些局部调整在大量个体上<b>反复相互作用、层层传递</b>，某几只鸟转向后其邻居跟随，邻居的邻居再跟随，于是整个群体在宏观上呈现整体转向、聚散有序的行为。整体表现出个体所不具备的性质，这就是<b>涌现</b>；它不需要中心指挥，属于<b>自组织</b>。<br><b>（3）生活例子（1 分，任一即可）</b>：鱼群骤然一致转向；体育场人浪；课间操人流在某处自动分流；球迷随鼓点整齐呼喊；蚁群靠信息素形成稳定路径。<br><span class="tag">评分</span> 只要写清“局部信息＋相互作用导致宏观整体行为”这一因果链即可给满分；只写“因为它们是一个群体”这类同义反复不给分。'}
]}
};

var state={paper:'selftest',ans:{},submitted:false,self:{},t0:0,left:0,tid:null};

function norm(s){
  s=(s||'').toLowerCase();
  var out='';
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c>=0xFF01&&c<=0xFF5E) out+=String.fromCharCode(c-0xFEE0); else out+=s[i];
  }
  return out.split(' ').join('').split('　').join('').split('\t').join('');
}
function blankOk(q,v){
  var n=norm(v); if(!n) return false;
  for(var i=0;i<q.need.length;i++){
    var it=q.need[i],ok=false;
    if(typeof it==='string'){ ok=n.indexOf(norm(it))>=0; }
    else { for(var j=0;j<it.length;j++){ if(n.indexOf(norm(it[j]))>=0){ok=true;break;} } }
    if(!ok) return false;
  }
  return true;
}
function lettersOf(q){
  if(q.t==='multi'){ var a=(state.ans[q._i]||[]).slice().sort().join(''); return a; }
  return state.ans[q._i]||'';
}
function isRight(q){
  var a=state.ans[q._i];
  if(q.t==='single') return a===q.a;
  if(q.t==='multi'){ var s=(a||[]).slice().sort().join(''); return s===q.a; }
  if(q.t==='tf') return a===q.a;
  if(q.t==='blank') return blankOk(q,a);
  return null;
}
function gained(q){
  if(q.t==='essay') return state.self[q._i]||0;
  var a=state.ans[q._i];
  if(q.t==='multi'){
    var s=(a||[]).slice().sort().join('');
    if(s===q.a) return q.s;
    if(s.length&&s.length<q.a.length){ var ok=true; for(var i=0;i<s.length;i++){ if(q.a.indexOf(s[i])<0){ok=false;break;} } if(ok) return 1; }
    return 0;
  }
  return isRight(q)?q.s:0;
}
function paper(){ return PAPERS[state.paper]; }

function refreshOpts(i){
  var q=paper().questions[i], card=document.getElementById('q'+i);
  if(!card) return;
  var labels=card.querySelectorAll('.opt');
  for(var k=0;k<labels.length;k++){
    var val = q.t==='tf' ? (k===0) : LETTERS[k];
    var cur = state.ans[i];
    var chosen = q.t==='multi' ? (cur||[]).indexOf(val)>=0 : (cur===val);
    labels[k].className='opt'+(chosen?' sel':'');
    var inp=labels[k].querySelector('input');
    if(inp) inp.checked=chosen;
  }
}
function askBar(msg,yes){
  var bar=document.getElementById('ask');
  document.getElementById('askmsg').textContent=msg;
  bar.className='ask on';
  document.getElementById('askyes').onclick=function(){ bar.className='ask'; yes(); };
  document.getElementById('askno').onclick=function(){ bar.className='ask'; };
}
function answeredCount(){
  var p=paper(),n=0;
  for(var i=0;i<p.questions.length;i++){
    var a=state.ans[i];
    if(p.questions[i].t==='multi'){ if(a&&a.length) n++; }
    else if(a!==undefined&&a!==null&&String(a).length) n++;
  }
  return n;
}

function fmt(sec){ var m=Math.floor(sec/60),s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function stopTimer(){ if(state.tid){ clearInterval(state.tid); state.tid=null; } }
function startTimer(){
  stopTimer();
  var p=paper(); state.left=p.limit||0; state.t0=Date.now();
  updTimer();
  state.tid=setInterval(function(){
    var el=(Date.now()-state.t0)/1000;
    if(p.limit){ state.left=Math.max(0,p.limit-Math.floor(el)); if(state.left===0){ stopTimer(); updTimer(); doSubmit(true); return; } }
    else state.left=Math.floor(el);
    updTimer();
  },500);
}
function updTimer(){
  var t=document.getElementById('timer'), s=fmt(state.left), c='timer'+((paper().limit&&state.left<=300)?' warn':'');
  if(t.textContent!==s) t.textContent=s;
  if(t.className!==c) t.className=c;
}

function render(){
  var p=paper(),box=document.getElementById('quiz');
  box.innerHTML='';
  for(var i=0;i<p.questions.length;i++){
    var q=p.questions[i]; q._i=i;
    var d=document.createElement('div'); d.className='q'; d.id='q'+i;
    var h='<div class="qh"><span class="no1">'+(i+1)+'.</span><span class="tag">'+q.s+' 分</span>';
    if(state.submitted){ var r=isRight(q), g0=gained(q);
      if(g0>=q.s) h+='<span class="tag g">✓ 正确</span>';
      else if(g0>0) h+='<span class="tag">◐ 部分得分 '+g0+' / '+q.s+'</span>';
      else if(r===false) h+='<span class="tag r">✗ 错误</span>';
      else h+='<span class="tag">自评给分</span>'; }
    h+='</div><div class="stem">'+q.q+'</div>';
    d.innerHTML=h;
    if(state.submitted){ var gg=gained(q); if(gg>=q.s) d.className+=' ok'; else if(gg<=0&&isRight(q)===false) d.className+=' no'; }

    if(q.t==='single'||q.t==='multi'||q.t==='tf'){
      var opts,vals;
      if(q.t==='tf'){ opts=['√ 正确','× 错误']; vals=[true,false]; }
      else { opts=q.o; vals=[]; for(var k=0;k<opts.length;k++) vals.push(LETTERS[k]); }
      for(var k=0;k<opts.length;k++){
        var lab=document.createElement('label'); lab.className='opt';
        var cur=state.ans[i];
        var chosen = q.t==='multi' ? (cur||[]).indexOf(vals[k])>=0 : (cur===vals[k]);
        if(chosen) lab.className+=' sel';
        if(state.submitted){
          var isKey = q.t==='multi' ? q.a.indexOf(vals[k])>=0 : (q.t==='tf'? vals[k]===q.a : vals[k]===q.a);
          if(isKey) lab.className+=' right'; else if(chosen) lab.className+=' wrong';
        }
        var inp=document.createElement('input');
        inp.type = q.t==='multi'?'checkbox':'radio'; inp.name='n'+i;
        inp.checked=chosen; inp.disabled=state.submitted;
        inp.value=String(vals[k]);
        inp.onchange=(function(qi,val,multi){ return function(e){
          if(multi){ var arr=state.ans[qi]||[]; var p2=arr.indexOf(val); if(p2>=0) arr.splice(p2,1); else arr.push(val); state.ans[qi]=arr; }
          else state.ans[qi]=val;
          refreshOpts(qi); updProg();
        };})(i,vals[k],q.t==='multi');
        var span=document.createElement('span');
        span.className='lt';
        span.textContent = q.t==='tf' ? '' : (LETTERS[k]+'.');
        var txt=document.createElement('span'); txt.innerHTML=opts[k];
        lab.appendChild(inp); if(q.t!=='tf') lab.appendChild(span); lab.appendChild(txt);
        d.appendChild(lab);
      }
    } else if(q.t==='blank'){
      var inp2=document.createElement('input');
      inp2.className='blank'; inp2.type='text'; inp2.placeholder='在此作答';
      inp2.value=state.ans[i]||''; inp2.disabled=state.submitted;
      inp2.oninput=(function(qi){ return function(e){ state.ans[qi]=e.target.value; updProg(); }; })(i);
      d.appendChild(inp2);
    } else {
      var ta=document.createElement('textarea');
      ta.placeholder='在这里写下你的答案（按“下定义 → 拆要素 → 找反馈 → 讲涌现／调控”分点写）';
      ta.value=state.ans[i]||''; ta.disabled=state.submitted;
      ta.oninput=(function(qi){ return function(e){ state.ans[qi]=e.target.value; updProg(); }; })(i);
      d.appendChild(ta);
    }

    if(state.submitted){
      var ex=document.createElement('div'); ex.className='exp'; ex.innerHTML='<b>参考答案／解析：</b><br>'+q.e;
      d.appendChild(ex);
      if(q.t==='essay'){
        var sf=document.createElement('div'); sf.className='self';
        sf.appendChild(document.createTextNode('自评得分：'));
        var opts3=[0,Math.round(q.s/2),q.s];
        for(var z=0;z<opts3.length;z++){
          (function(val,qi){
            var b=document.createElement('button');
            b.textContent=val+' 分';
            if((state.self[qi]||0)===val) b.className='on';
            b.onclick=function(){ state.self[qi]=val; render(); updProg(); };
            sf.appendChild(b);
          })(opts3[z],i);
        }
        sf.appendChild(document.createTextNode('（总分 '+q.s+' 分，自己对要点给分）'));
        d.appendChild(sf);
      }
    }
    box.appendChild(d);
  }
  renderScore(); updProg(); updTimer();
}

function renderScore(){
  var box=document.getElementById('score');
  if(!state.submitted){ box.innerHTML=''; return; }
  var p=paper(),got=0,tot=0;
  for(var i=0;i<p.questions.length;i++){ got+=gained(p.questions[i]); tot+=p.questions[i].s; }
  var h='<div class="panel"><div style="color:var(--dim);font-size:13px">'+p.name+' · 你的得分</div>';
  h+='<div><span class="big">'+got+'</span> <span style="color:var(--dim)">/ '+tot+' 分</span></div>';
  if(p.mods){
    var wrong={};
    for(var i=0;i<p.questions.length;i++){ var q=p.questions[i]; if(q.t==='essay') continue; if(!isRight(q)) wrong[i+1]=1; }
    var keys=Object.keys(wrong);
    h+='<div class="mods" style="margin-top:10px"><b style="color:var(--txt)">错题归因</b><br>';
    if(!keys.length) h+='<div style="color:var(--green)">客观题全对 🎉 考前只需过一遍《易错对比表》。</div>';
    else {
      h+='<div style="color:var(--dim)">错题号：'+keys.join('、')+'</div>';
      for(var m=0;m<p.mods.length;m++){
        var nm=p.mods[m][0],nums=p.mods[m][1],hit=[];
        for(var n=0;n<nums.length;n++) if(wrong[nums[n]]) hit.push(nums[n]);
        if(hit.length) h+='<div>'+nm+' → <b>'+hit.join('、')+'</b> 题</div>';
      }
    }
    h+='</div>';
  }
  h+='<div style="margin-top:10px;color:var(--dim);font-size:13px">90–100 可以上考场 ｜ 75–89 回看错题 ｜ 60–74 重读清单 ｜ 60 以下先背基础概念＋老三论新三论</div>';
  h+='</div>';
  box.innerHTML=h;
}
function updProg(){
  document.getElementById('prog').textContent='已答 '+answeredCount()+' / '+paper().questions.length;
}
function doSubmit(auto){
  if(state.submitted) return;
  var p=paper(),n=answeredCount();
  if(!auto&&n<p.questions.length){
    askBar('还有 '+(p.questions.length-n)+' 题没答，确定要提交吗？', function(){ finishSubmit(); });
    return;
  }
  finishSubmit();
}
function finishSubmit(){ state.submitted=true; stopTimer(); render(); window.scrollTo(0,0); }
function loadPaper(p){
  state.paper=p; state.ans={}; state.self={}; state.submitted=false;
  document.getElementById('tab-selftest').className=(p==='selftest'?'on':'');
  document.getElementById('tab-mockA').className=(p==='mockA'?'on':'');
  render(); startTimer();
}
document.getElementById('tab-selftest').onclick=function(){ loadPaper('selftest'); };
document.getElementById('tab-mockA').onclick=function(){ loadPaper('mockA'); };
document.getElementById('submit').onclick=function(){ doSubmit(false); };
document.getElementById('reset').onclick=function(){ askBar('清空全部答案，重新开始？', function(){ loadPaper(state.paper); }); };
loadPaper('selftest');
</script>
</body>
